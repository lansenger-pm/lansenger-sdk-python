[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lansenger-sdk"
version = "1.6.6"
description = "Framework-independent Python SDK for Lansenger (蓝信) Smart Bot API — send messages, files, images, cards, callback decryption"
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lanxin Mobile (Beijing) Technology Co., ltd." },
]
keywords = ["lansenger", "蓝信", "chatbot", "messaging", "sdk", "agent", "enterprise-chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lansenger_sdk = ["py.typed"]

[project.urls]
Homepage = "https://github.com/lansenger-pm/lansenger-skills-official"
Repository = "https://github.com/lansenger-pm/lansenger-skills-official"