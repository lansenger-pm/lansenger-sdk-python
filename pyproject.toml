[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lansenger-sdk"
version = "1.7.4"
description = "Framework-independent Python SDK for Lansenger (蓝信) Smart Bot API — send messages, files, images, cards, callback decryption"
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lanxin Mobile (Beijing) Technology Co., ltd." },
]
keywords = ["lansenger", "蓝信", "chatbot", "messaging", "sdk", "agent", "enterprise-chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lansenger_sdk = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[project.urls]
Homepage = "https://github.com/lansenger-pm/lansenger-skills-official"
Repository = "https://github.com/lansenger-pm/lansenger-skills-official"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Focus on catching real bugs: undefined names, syntax errors, common pitfalls
select = ["F", "E", "W", "B"]
ignore = [
    "E501", # line too long
    "F401", # unused import (__init__.py re-exports trigger too many)
    "F821", # undefined name in type annotations (safe with `from __future__ import annotations`)
    "F841", # unused variable (often intentional)
]
